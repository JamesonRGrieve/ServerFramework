# END generated by zephyrex.extensions.sync_dependencies
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "pytest-dependency",
    "pytest-order",
    "black",
    "coverage",
    "mypy>=1.0",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "zephyrex*",
    "sdk*",
]
exclude = [
    "*__pycache__*",
    "*_test.py",
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.toml", "*.mako"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
# zephyrex.mypy_plugin must precede pydantic.mypy; see its module docstring.
plugins = ["zephyrex.mypy_plugin", "pydantic.mypy"]

[tool.isort]
profile = "black"
line_length = 88
