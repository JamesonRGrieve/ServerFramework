[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex"
version = "1.0.0a1"
description = "Extensible Python server framework with pluggable extensions, providers, and auto-generated SDK"
readme = "docs/README.md"
authors = [
    {name = "ZephyrexTechnologies", email = "pypi@zephyrex.dev"},
]
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = ["api", "server", "framework", "fastapi", "extensions", "graphql"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn",
    "pydantic[email]>=2.0",
    "ordered_set",
    "alembic",
    "aiosqlite",
    "SQLAlchemy>=2.0",
    "broadcaster",
    "greenlet",
    "strawberry-graphql[fastapi]",
    "bcrypt",
    "cryptography",
    "pyjwt",
    "httpx",
    "colorama",
    "distro",
    "inflect",
    "loguru",
    "networkx",
    "numpy",
    "python-dotenv",
    "resolvelib",
    "semver",
    "stringcase",
    "tldextract",
    "tomli_w",
    "toon-format",
    "pyyaml",
]

[project.urls]
Homepage = "https://git.zephyrex.dev/ZephyrexTechnologies/ServerFramework"
Repository = "https://git.zephyrex.dev/ZephyrexTechnologies/ServerFramework.git"
Issues = "https://git.zephyrex.dev/ZephyrexTechnologies/ServerFramework/issues"

[project.scripts]
zephyrex = "zephyrex.cli:main"

[project.optional-dependencies]
# Core's own: the Valkey/Redis cache, rate limiter and replay store.
cache = ["redis>=4.2.0"]
# One extra per bundled extension, e.g. pip install "zephyrex[auth-mfa]".
# BEGIN generated by zephyrex.extensions.sync_dependencies
acl-rbac = []
audit-retention = []
auth-api-keys = []
auth-device-pairing = []
auth-invitations = []
auth-lockout = []
auth-magic-link = []
auth-marketplace = []
auth-merge = []
auth-mfa = ["pyotp>=2.8.0", "qrcode[pil]>=7.4.0"]
auth-notifications = []
auth-oauth2-client = ["requests>=2.28.0"]
auth-privacy = []
auth-recovery-questions = []
auth-session = []
backup-restore = []
billing = []
database = ["gql>=3.4.0", "influxdb-client>=1.36.0", "influxdb>=5.3.0", "mysql-connector-python>=9.0.0", "psycopg2-binary>=2.9.0", "pymongo>=4.0.0", "pyodbc>=5.0.0", "requests>=2.28.0"]
database-memory = ["redis>=4.2.0"]
email = ["aiosmtplib>=3.0.0", "google-api-python-client>=2.0.0", "google-auth>=2.0.0", "httpx>=0.27.0", "requests>=2.28.0", "sendgrid>=6.10.0"]
federation = []
fileio = ["psutil>=5.9.0"]
meta-labels = []
meta-logging = []
meta-sdk-py = []
meta-sdk-rs = []
meta-sdk-ts = []
metadata = []
observability = ["opentelemetry-api>=1.20.0", "prometheus-client>=0.20.0", "rollbar>=1.0.0", "sentry-sdk>=2.0.0"]
payment = ["httpx>=0.24.0", "paypalrestsdk>=1.13.0", "squareup>=37.0.0,<42", "stripe>=15.0.0"]
privacy = []
quota = []
secret-vault = ["hvac>=2.1.0"]
webhooks = []
all = ["zephyrex[acl-rbac]", "zephyrex[audit-retention]", "zephyrex[auth-api-keys]", "zephyrex[auth-device-pairing]", "zephyrex[auth-invitations]", "zephyrex[auth-lockout]", "zephyrex[auth-magic-link]", "zephyrex[auth-marketplace]", "zephyrex[auth-merge]", "zephyrex[auth-mfa]", "zephyrex[auth-notifications]", "zephyrex[auth-oauth2-client]", "zephyrex[auth-privacy]", "zephyrex[auth-recovery-questions]", "zephyrex[auth-session]", "zephyrex[backup-restore]", "zephyrex[billing]", "zephyrex[cache]", "zephyrex[database]", "zephyrex[database-memory]", "zephyrex[email]", "zephyrex[federation]", "zephyrex[fileio]", "zephyrex[meta-labels]", "zephyrex[meta-logging]", "zephyrex[meta-sdk-py]", "zephyrex[meta-sdk-rs]", "zephyrex[meta-sdk-ts]", "zephyrex[metadata]", "zephyrex[observability]", "zephyrex[payment]", "zephyrex[privacy]", "zephyrex[quota]", "zephyrex[secret-vault]", "zephyrex[webhooks]"]
# END generated by zephyrex.extensions.sync_dependencies
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "pytest-dependency",
    "pytest-order",
    "black",
    "coverage",
    "faker",
    "filelock",
    "mypy>=1.0",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "zephyrex*",
    "sdk*",
]
exclude = [
    "*__pycache__*",
    "*_test.py",
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
# zephyrex.mypy_plugin must precede pydantic.mypy; see its module docstring.
plugins = ["zephyrex.mypy_plugin", "pydantic.mypy"]

[tool.isort]
profile = "black"
line_length = 88
