[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex"
version = "0.0.1a2"
description = "Extensible Python server framework with pluggable extensions, providers, and auto-generated SDK"
readme = "docs/README.md"
authors = [
    {name = "ZephyrexTechnologies", email = "pypi@zephyrex.dev"},
]
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = ["api", "server", "framework", "fastapi", "extensions", "graphql"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn",
    "pydantic[email]>=2.0",
    "ordered_set",
    "alembic",
    "aiosqlite",
    "SQLAlchemy>=2.0",
    "broadcaster",
    "greenlet",
    "strawberry-graphql[fastapi]",
    "bcrypt",
    "cryptography",
    "pyjwt",
    "httpx",
    "colorama",
    "defusedxml",
    "distro",
    "faker",
    "filelock",
    "inflect",
    "loguru",
    "networkx",
    "numpy",
    "python-dotenv",
    "resolvelib",
    "semver",
    "stringcase",
    "tldextract",
    "tomli_w",
    "toon-format",
    "pyyaml",
]

[project.urls]
Homepage = "https://git.zephyrex.dev/ZephyrexTechnologies/ServerFramework"
Repository = "https://git.zephyrex.dev/ZephyrexTechnologies/ServerFramework.git"
Issues = "https://git.zephyrex.dev/ZephyrexTechnologies/ServerFramework/issues"

[project.scripts]
zephyrex = "zephyrex.cli:main"

[project.optional-dependencies]
# Core's own: the Valkey/Redis cache, rate limiter and replay store.
cache = ["redis>=4.2.0"]
# Core's own: the MCP server mounted when MCP=true, exposing this API's
# endpoints as MCP tools (the mcp-client extension calls out instead).
mcp-server = ["mcp>=2.0"]
