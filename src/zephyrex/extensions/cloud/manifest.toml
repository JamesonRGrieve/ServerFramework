# Extension manifest (Item 20): what an installer reads before the extension
# class can be imported. It mirrors the class (name, version, description,
# dependencies); the class stays the source of truth and
# Manifest_parity_test keeps the two in step.

name = "cloud"
version = "1.0.0"
description = "Cloud object storage on S3, Azure Blob, Google Cloud Storage, Dropbox and Nextcloud"
author = "ZephyrexTechnologies"
entry_module = "EXT_Cloud"
minimum_framework_version = "0.0.0"

pip_dependencies = ["azure-core>=1.29.0", "azure-storage-blob>=12.19.0", "boto3>=1.26.0", "botocore>=1.29.0", "dropbox>=11.36.0", "google-api-core>=2.11.0", "google-auth>=2.0.0", "google-cloud-storage>=2.10.0"]
system_dependencies = []
