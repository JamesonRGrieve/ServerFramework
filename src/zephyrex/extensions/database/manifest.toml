# Extension manifest (Item 20): what an installer reads before the extension
# class can be imported. It mirrors the class (name, version, description,
# dependencies); the class stays the source of truth and
# Manifest_parity_test keeps the two in step.

name = "database"
version = "1.0.0"
description = "Database extension providing comprehensive database connectivity via Provider Rotation System"
author = "ZephyrexTechnologies"
entry_module = "EXT_Database"
minimum_framework_version = "0.0.0"

pip_dependencies = ["gql>=3.4.0", "influxdb-client>=1.36.0", "influxdb>=5.3.0", "mysql-connector-python>=9.0.0", "psycopg2-binary>=2.9.0", "pymongo>=4.0.0", "pyodbc>=5.0.0", "requests-toolbelt>=1.0.0", "requests>=2.28.0"]
system_dependencies = []
