# Extension manifest (Item 20): what an installer reads before the extension
# class can be imported. It mirrors the class (name, version, description,
# dependencies); the class stays the source of truth and
# Manifest_parity_test keeps the two in step.

name = "ai_agents"
version = "2.0.0"
description = "Agents that take turns on schedules, tasks and messages, acting through the abilities they are granted"
author = "ZephyrexTechnologies"
entry_module = "EXT_AI_Agents"
minimum_framework_version = "0.0.0"

pip_dependencies = ["croniter>=6.0.0"]
system_dependencies = []

[[extension_dependencies]]
name = "ai"
optional = false

[[extension_dependencies]]
name = "conversations"
optional = false

[[extension_dependencies]]
name = "ai_prompts"
optional = false

[[extension_dependencies]]
name = "ai_memories"
optional = false
