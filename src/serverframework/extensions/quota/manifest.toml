name = "quota"
version = "1.0.0"
description = "Per-user / per-team / system quota model with atomic decrement"
author = "ZephyrexTechnologies"
entry_module = "EXT_Quota"
minimum_framework_version = "0.0.0"

pip_dependencies = []
system_dependencies = []

# Cost-aware quotas (USD caps) require the billing extension's cost model.
# Plain call-count / token-count / byte-count quotas do not.
[[extension_dependencies]]
name = "billing"
optional = true
