[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "server"
version = "0.0.0"
description = "Extensible server framework"
readme = "README.md"
authors = [
    {name = "ZephyrexTechnologies", email = "sdk@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["api", "server", "framework"]
dependencies = [
    # Build system
    "setuptools<58",

    # Core Web Framework
    "fastapi",
    "uvicorn",
    "fastapi-mcp",

    # Data Validation & Serialization
    "pydantic",
    "email-validator",
    "ordered_set",

    # Database & ORM
    "alembic",
    "aiosqlite",
    "SQLAlchemy",

    # Asynchronous Operations
    "broadcaster",
    "greenlet",

    # GraphQL
    "strawberry-graphql[fastapi]",

    # Authentication & Security
    "bcrypt",
    "cryptography",
    "pyjwt",

    # HTTP Clients
    "httpx",

    # Utilities
    "colorama",
    "distro",
    "inflect",
    "loguru",
    "networkx",
    "numpy",
    "sendgrid",
    "python-dotenv",
    "resolvelib",
    "semver",
    "stringcase",
    "tldextract",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/JamesonRGrieve/ServerFramework"
Repository = "https://github.com/JamesonRGrieve/ServerFramework.git"
Issues = "https://github.com/JamesonRGrieve/ServerFramework/issues"

[project.scripts]
server-framework = "serverframework.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "pytest-dependency",
    "pytest-order",
    "black",
    "coverage",
    "faker",
    "isort>=5.10.0",
    "mypy>=0.910",
    "pylint>=2.12.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "serverframework*",
    "sdk*",
]
exclude = [
    "*__pycache__*",
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
]
namespaces = true

[tool.setuptools.package-data]
# Item 67 — the sibling ``version`` file was removed; the version
# string now comes solely from `[project.version]` (which feeds
# ``importlib.metadata.version("serverframework")`` at runtime).
"*" = ["*.json", "*.md"]

[tool.serverframework.supply_chain]
# Item 86 — Supply-chain hygiene declarations consumed by the release pipeline.
# These knobs are read by ``lib.SupplyChain`` helpers and by the CI workflow
# that gates releases on SBOM emission, signature attestation, and vuln scan
# results. See docs/SECURITY.md for the operator-facing contract.
sbom_format = "cyclonedx"
signing = "sigstore"
vuln_scanner = "pip-audit"
severity_gate = "HIGH"
lock_file = "requirements.lock"

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "*_test.py"
addopts = "-v -ra -s --order-dependencies --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Note: Changed from "session" to "function" for pytest-xdist compatibility.
# Each xdist worker runs in a separate process, and session-scoped event loops
# don't work correctly across workers. Function scope ensures each test gets
# a fresh event loop, avoiding asyncio conflicts when running with -n N.

markers = [
    "db: Database tests",
    "bll: Business logic tests", 
    "ep: Endpoint tests",
    "gql: GraphQL tests",
    "sdk: SDK tests",
    "user: User management tests",
    "team: Team management tests",
    "providers: Provider-related tests",
    "extensions: Extension management tests",
    "seed: Data seeding tests",
    "auth: Authentication tests",
    "migration: Migration system tests",
    "basic: Basic migration functionality tests",
    "core: Core migration tests",
    "extension: Extension migration tests",
    "complex: Complex migration scenario tests",
    "regenerate: Migration regeneration tests",
    "mfa: Multi-factor authentication tests",
    "payment: Payment system tests",
    "synchronize: Synchronization tests",
    "mock: Mock-based tests",
    "real: Real database tests",
    "stripe: Stripe payment provider tests",
    "timeout: Test timeout configuration"
]

# Parallel execution settings
# --dist=loadscope: Distribute tests by scope (class-level)
# -n auto: Automatically detect number of CPUs and create workers
# Override with: -n <number> to specify worker count
# Override with: -n 0 to disable parallel execution
# Override with: --dist=loadfile to distribute by file instead
# --maxfail=1: Stop on first failure when debugging
# --tb=short: Shorter traceback format for parallel runs 