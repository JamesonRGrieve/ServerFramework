[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "server"
version = "0.0.0"
description = "Extensible server framework"
readme = "README.md"
authors = [
    {name = "ZephyrexTechnologies", email = "sdk@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["api", "server", "framework"]
dependencies = [
    # Build system
    "setuptools<58",

    # Core Web Framework
    "fastapi",
    "uvicorn",
    "fastapi-mcp",

    # Data Validation & Serialization
    "pydantic[email]",
    "ordered_set",

    # Database & ORM
    "alembic",
    "aiosqlite",
    "SQLAlchemy",

    # Asynchronous Operations
    "broadcaster",
    "greenlet",

    # GraphQL
    "strawberry-graphql[fastapi]",

    # Authentication & Security
    "bcrypt",
    "cryptography",
    "pyjwt",

    # HTTP Clients
    "httpx",

    # Utilities
    "colorama",
    "distro",
    "inflect",
    "loguru",
    "networkx",
    "numpy",
    "sendgrid",
    "python-dotenv",
    "resolvelib",
    "semver",
    "stringcase",
    "tldextract",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/JamesonRGrieve/ServerFramework"
Repository = "https://github.com/JamesonRGrieve/ServerFramework.git"
Issues = "https://github.com/JamesonRGrieve/ServerFramework/issues"

[project.scripts]
server-framework = "serverframework.cli:main"

[project.optional-dependencies]
email = ["sendgrid"]
mfa = ["pyotp", "qrcode"]
payment = ["stripe"]
cache = ["redis"]
all = [
    "server[email,mfa,payment,cache]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "pytest-dependency",
    "pytest-order",
    "black",
    "coverage",
    "faker",
    "filelock",
    "isort>=5.10.0",
    "mypy>=0.910",
    "pylint>=2.12.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "serverframework*",
    "sdk*",
]
exclude = [
    "*__pycache__*",
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
]
namespaces = true

[tool.setuptools.package-data]
# Item 67 — the sibling ``version`` file was removed; the version
# string now comes solely from `[project.version]` (which feeds
# ``importlib.metadata.version("serverframework")`` at runtime).
"*" = ["*.json", "*.md"]

[tool.serverframework.supply_chain]
# Item 86 — Supply-chain hygiene declarations consumed by the release pipeline.
# These knobs are read by ``lib.SupplyChain`` helpers and by the CI workflow
# that gates releases on SBOM emission, signature attestation, and vuln scan
# results. See docs/SECURITY.md for the operator-facing contract.
sbom_format = "cyclonedx"
signing = "sigstore"
vuln_scanner = "pip-audit"
severity_gate = "HIGH"
lock_file = "requirements.lock"

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Pytest configuration lives in pytest.ini (the authoritative source).
# Do NOT add [tool.pytest.ini_options] here — it is shadowed by pytest.ini
# and divergence has already caused bugs.