name: Item 42 — Event-schema compatibility

# Modeled on Item 11's contract-drift snapshots: every event-bus event class
# has its Pydantic schema captured into a committed JSON snapshot. This
# workflow runs the live event registry against the snapshot on every PR
# and fails on any breaking change (removed/renamed/narrowed fields,
# optional-becomes-required tightening). Additive changes (new optional
# fields, new event types) pass; the snapshot is regenerated by the
# author and committed in the same PR.

on:
  pull_request:
    paths:
      - "src/zephyrex/logic/**"
      - "src/zephyrex/extensions/**"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check event schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.lock

      - name: Run schema check
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          from zephyrex.logic.EventBus_SchemaCheck import (
              check_compatibility,
              discover_event_classes,
              read_snapshot,
              write_snapshot,
          )

          SNAPSHOT_PATH = Path("docs/event_schemas.snapshot.json")

          # Modules to walk for event classes. Operators add to this list
          # whenever a new module declares typed events.
          modules = [
              "zephyrex.logic.BLL_Auth",
              "zephyrex.logic.BLL_Providers",
              "zephyrex.logic.BLL_Extensions",
              # extension event modules go here as they ship.
          ]

          live_classes = discover_event_classes(modules)
          snapshot = read_snapshot(SNAPSHOT_PATH)

          if not snapshot and not live_classes:
              print("No event classes discovered, no snapshot present.")
              sys.exit(0)

          if not snapshot:
              print("No snapshot present yet; generating one.")
              write_snapshot(SNAPSHOT_PATH, live_classes)
              print(f"Wrote {SNAPSHOT_PATH} with {len(live_classes)} events.")
              sys.exit(0)

          report = check_compatibility(snapshot, live_classes)
          if report.additive:
              print("Additive changes:")
              for note in report.additive:
                  print(f"  + {note}")
          if not report.is_compatible:
              print("Breaking changes detected:")
              for finding in report.breaking:
                  print(f"  - {finding.event}: {finding.kind}: {finding.detail}")
              sys.exit(1)
          print(f"Schema check OK ({len(live_classes)} events).")
          PY
