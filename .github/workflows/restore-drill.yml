name: Item 79 — Restore drill

# Runs the framework's `RestoreDrillService` against a sample backup to verify
# the restore path is operational. Item 79 mandates a monthly drill; we
# additionally run on every push to `main` so a regression in the backup
# / restore code is caught at PR time rather than at the next monthly cron.
#
# The drill uses `SqliteBackupCommand` + `LocalFilesystemBackupTarget` —
# both ship in `lib/Backup.py` — so the CI host needs only `sqlite3` on
# its PATH. Production deployments using `PgDumpBackupCommand` should
# replicate this workflow against a sandbox Postgres.

on:
  push:
    branches: [main]
  schedule:
    # Monthly drill: 04:00 UTC on the 1st.
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drill:
    name: Restore drill (sqlite3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify sqlite3 binary is present
        run: which sqlite3 && sqlite3 --version

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.lock

      - name: Run the restore drill
        env:
          PYTHONPATH: src
        run: |
          python -m serverframework.lib._restore_drill_runner

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: /tmp/restore_drill_report.json
