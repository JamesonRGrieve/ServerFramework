# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# A `v*` tag builds, signs and audits the wheel and sdist, publishes them to
# TestPyPI, checks TestPyPI serves exactly those files, smoke-tests them (the
# wheel as `zephyrex` and `zephyrex[all]`, and the sdist), and only then
# publishes the same files to PyPI, behind the `pypi` environment's required
# reviewer.
# Pre-release versions (a/b/rc/dev) are internal and stop after the smoke
# test; only a final version goes on to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC): no token is stored. Each
# index needs a trusted publisher for this repository, this workflow
# (release.yml) and its environment (`testpypi`, `pypi`).
#
# A manual run (workflow_dispatch) builds, audits and signs only.
#
# Signatures are sigstore bundles, keyless via this workflow's OIDC identity:
#   sigstore verify identity \
#     --cert-identity-regexp '^https://github\.com/JamesonRGrieve/ServerFramework/' \
#     --cert-oidc-issuer https://token.actions.githubusercontent.com \
#     --bundle <file>.sigstore <file>

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, audit, sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # sigstore keyless signing
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build, audit and signing tools
        run: python -m pip install -U pip build cyclonedx-bom pip-audit sigstore

      - name: Read the version, and check a tag matches it
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # a/b/rc/dev versions are internal: TestPyPI only.
          prerelease=$(python -c "from packaging.version import Version; print(str(Version('${version}').is_prerelease).lower())")
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

      - name: Check extras match the extensions' declarations
        # Against the manifests, importing no extension: only core is
        # installed here, and an extension's optional packages are not.
        # The commit gate holds the manifests to the code.
        run: |
          python -m pip install -e .
          python -m zephyrex.extensions.sync_dependencies --check --from-manifests

      - name: Build wheel and sdist
        # Both from the checkout (not the wheel from the sdist), so the
        # wheel's provenance manifest records this commit and its state.
        run: python -m build --sdist --wheel --outdir dist

      - name: Check the wheel ships no tests and vouches for this commit
        run: python scripts/check_wheel.py dist "$GITHUB_SHA"

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p release
          cyclonedx-py requirements requirements.lock \
            --output-format JSON --output-file release/bom.json

      - name: Audit dependencies (any known vulnerability fails)
        # pip-audit exits 1 both for vulnerabilities found and on its own
        # errors: the gate tells them apart from the report, and fails on a
        # pip-audit error, an empty or malformed report, or any vulnerability.
        run: |
          status=0
          pip-audit -r requirements.lock --format json > audit-report.json || status=$?
          python scripts/audit_gate.py audit-report.json --pip-audit-status "$status"

      - name: Sign wheel and sdist (sigstore, keyless)
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            sigstore sign --bundle "release/$(basename "$artifact").sigstore" "$artifact"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-extras
          path: release/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/zephyrex/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # No skip-existing: re-uploading an identical file is accepted (a
          # re-run of this run), but a re-tag whose build differs from what
          # TestPyPI already holds fails here instead of smoke-testing the old
          # upload and publishing the new, untested build to PyPI. TestPyPI
          # never frees a version, so such a release needs a new version.

  smoke-testpypi:
    name: Smoke-test the files TestPyPI serves (wheel and sdist)
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The very files publish-pypi uploads.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: /tmp/dist/
      - name: Check TestPyPI serves exactly the files to be published
        # By sha256, every file: the smoke test below installs these files,
        # so it vouches for TestPyPI's upload, and for PyPI's, only if they
        # are one and the same.
        shell: python
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          import hashlib, json, os, sys, time, urllib.request
          from pathlib import Path

          ATTEMPTS, PAUSE_SECONDS = 6, 20
          url = f"https://test.pypi.org/pypi/zephyrex/{os.environ['VERSION']}/json"
          built = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("/tmp/dist").iterdir()
          }
          if not any(n.endswith(".whl") for n in built) or not any(
              n.endswith(".tar.gz") for n in built
          ):
              sys.exit(f"dist lacks a wheel or an sdist: {sorted(built)}")
          served = {}
          for attempt in range(1, ATTEMPTS + 1):
              try:
                  with urllib.request.urlopen(url) as response:
                      served = {
                          entry["filename"]: entry["digests"]["sha256"]
                          for entry in json.load(response)["urls"]
                      }
              except OSError as error:
                  print(f"TestPyPI: {error}")
              if built.keys() <= served.keys():
                  break
              print(f"TestPyPI does not serve every file yet (attempt {attempt})")
              time.sleep(PAUSE_SECONDS)
          else:
              sys.exit(f"TestPyPI never served {sorted(built.keys() - served.keys())}")
          if served != built:
              sys.exit(
                  "TestPyPI holds other files for this version than the ones "
                  f"built here: served {served}, built {built}. TestPyPI never "
                  "frees a version: release a new one."
              )
          print(f"TestPyPI serves exactly {sorted(built)}")
      - name: Install the wheel (dependencies from PyPI only)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls /tmp/dist/zephyrex-*.whl)"
          /tmp/smoke/bin/pip check
      - name: Smoke test zephyrex (core dependencies only)
        working-directory: /tmp
        run: |
          /tmp/smoke/bin/zephyrex version
          /tmp/smoke/bin/python "${GITHUB_WORKSPACE}/scripts/release_smoke.py" --core
      - name: Install the system packages the extensions declare
        # Read from the installed manifests: some extras build from source
        # (gssapi needs libkrb5-dev), and xmlsec1 and openscad are run.
        working-directory: /tmp
        run: |
          packages=$(/tmp/smoke/bin/python "${GITHUB_WORKSPACE}/scripts/release_smoke.py" --system-packages)
          echo "System packages: ${packages}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${packages}
      - name: Install zephyrex[all]
        run: |
          wheel=$(ls /tmp/dist/zephyrex-*.whl)
          /tmp/smoke/bin/pip install "zephyrex[all] @ file://${wheel}"
          /tmp/smoke/bin/pip check
      - name: Smoke test zephyrex[all]
        working-directory: /tmp
        run: /tmp/smoke/bin/python "${GITHUB_WORKSPACE}/scripts/release_smoke.py"
      - name: Smoke test the sdist (built and installed in a clean venv)
        # The sdist is published too: it must build, ship every manifest
        # (--system-packages reads them) and boot on core dependencies.
        working-directory: /tmp
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install "$(ls /tmp/dist/zephyrex-*.tar.gz)"
          /tmp/smoke-sdist/bin/pip check
          /tmp/smoke-sdist/bin/zephyrex version
          /tmp/smoke-sdist/bin/python "${GITHUB_WORKSPACE}/scripts/release_smoke.py" --system-packages
          /tmp/smoke-sdist/bin/python "${GITHUB_WORKSPACE}/scripts/release_smoke.py" --core

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke-testpypi]
    # Pre-releases stop at TestPyPI; only a final version reaches PyPI.
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi # required reviewer: the release waits here for approval
      url: https://pypi.org/project/zephyrex/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to the GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/dist/*
            artifacts/release-extras/*
